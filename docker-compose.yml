services:
  mysql:
    image: mysql:8.0.36
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports: ["3306:3306"]
    volumes:
      - ./docs/sql:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      # -h 127.0.0.1 强制走 TCP：entrypoint 初始化期的临时服务器 socket 可达但初始化未完成，走 socket 会提前判定 healthy
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.2-alpine
    # 宿主机端口可配置：本机 6379 已被其他 Redis 占用时 REDIS_HOST_PORT=16379 make up 覆盖；容器网络内仍是 6379，服务间访问不受影响
    ports: ["${REDIS_HOST_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nacos:
    # v3.0.3 与 SCA 2025.0.0.0 内置的 nacos-client 3.0.3 对齐（v3 console 默认 8080，但不映射宿主机，与网关端口无冲突）
    image: nacos/nacos-server:v3.0.3
    environment:
      MODE: standalone
      # v3.0.3 的 docker-startup.sh 无条件校验下面三个变量，缺任意一个直接 exit 255（容器秒退、依赖它的服务全部起不来）。
      # 本地 demo 关闭服务端 API 鉴权（nacos.core.auth.enabled=false），故各服务的 nacos-client 无需配置 username/password；
      # 但 token 仍被 console/admin 鉴权使用，必须是 Base64 且解码后 >= 32 字节，上线前请自行更换。
      NACOS_AUTH_ENABLE: "false"
      NACOS_AUTH_TOKEN: TWFsbENvbnNpc3RlbmN5TGFiTmFjb3NEZW1vU2VjcmV0S2V5MjAyNkNoYW5nZU1lTG9jYWxPbmx5MTIzNDU2Nzg5MA==
      NACOS_AUTH_IDENTITY_KEY: serverIdentity
      NACOS_AUTH_IDENTITY_VALUE: mall-consistency-lab-local
    ports: ["8848:8848", "9848:9848"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8848/nacos/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  gateway:
    build: ./mall-gateway
    ports: ["8080:8080"]
    environment:
      NACOS_ADDR: nacos:8848
      JWT_SECRET: local-demo-jwt-secret-change-me-1234567890
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      nacos: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20

  user-service:
    build: ./mall-user
    environment:
      NACOS_ADDR: nacos:8848
      DB_URL: jdbc:mysql://mysql:3306/mall_user?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET: local-demo-jwt-secret-change-me-1234567890
    depends_on:
      mysql: { condition: service_healthy }
      nacos: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20

  product-service:
    build: ./mall-product
    environment:
      NACOS_ADDR: nacos:8848
      DB_URL: jdbc:mysql://mysql:3306/mall_product?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USERNAME: root
      DB_PASSWORD: root
      REDIS_HOST: redis
      JWT_SECRET: local-demo-jwt-secret-change-me-1234567890
      # 孤儿扣减对账：默认扣减 10 分钟后仍无订单则回补，每 5 分钟扫描一轮
      RECONCILE_STALE_MINUTES: ${RECONCILE_STALE_MINUTES:-10}
      RECONCILE_INTERVAL_MS: ${RECONCILE_INTERVAL_MS:-300000}
      RECONCILE_INITIAL_DELAY_MS: ${RECONCILE_INITIAL_DELAY_MS:-120000}
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      nacos: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20

  order-service:
    build: ./mall-order
    environment:
      NACOS_ADDR: nacos:8848
      DB_URL: jdbc:mysql://mysql:3306/mall_order?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET: local-demo-jwt-secret-change-me-1234567890
      # 超时自动确认收货：默认发货 7 天后自动完成，每 5 分钟扫描一轮
      AUTO_COMPLETE_DAYS: ${AUTO_COMPLETE_DAYS:-7}
      AUTO_COMPLETE_INTERVAL_MS: ${AUTO_COMPLETE_INTERVAL_MS:-300000}
      AUTO_COMPLETE_INITIAL_DELAY_MS: ${AUTO_COMPLETE_INITIAL_DELAY_MS:-60000}
      # 超时自动关单：默认下单 30 分钟未支付自动取消并回补库存，每 5 分钟扫描一轮
      AUTO_CLOSE_MINUTES: ${AUTO_CLOSE_MINUTES:-30}
      AUTO_CLOSE_INTERVAL_MS: ${AUTO_CLOSE_INTERVAL_MS:-300000}
      AUTO_CLOSE_INITIAL_DELAY_MS: ${AUTO_CLOSE_INITIAL_DELAY_MS:-90000}
    depends_on:
      mysql: { condition: service_healthy }
      nacos: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
