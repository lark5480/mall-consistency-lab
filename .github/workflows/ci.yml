name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: mvn -B compile
      - run: mvn -B test
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: pnpm, cache-dependency-path: mall-consistency-lab-frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
        working-directory: mall-consistency-lab-frontend
      - run: pnpm -r build
        working-directory: mall-consistency-lab-frontend
  images:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: mvn -B package -DskipTests
      - run: |
          for module in mall-gateway mall-user mall-product mall-order; do
            docker build "$module"
          done
