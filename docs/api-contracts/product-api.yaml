openapi: 3.0.3
info:
  title: Mall Product API
  version: 1.1.0
paths:
  /api/v1/categories:
    get:
      operationId: listCategories
      description: 公开接口，无需登录；C 端分类筛选与 B 端管理共用。
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CategoryListResult' } } } }
  /api/v1/products:
    get:
      operationId: listProducts
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: size, in: query, schema: { type: integer, default: 10 } }
        - { name: categoryId, in: query, schema: { type: integer, format: int64 } }
        - { name: keyword, in: query, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ProductPageResult' } } } }
    post:
      operationId: createProduct
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProductCreateRequest' } } } }
      responses:
        "200": { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/ProductResult' } } } }
  /api/v1/products/{productId}:
    parameters:
      - { name: productId, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: getProduct
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ProductResult' } } } }
    put:
      operationId: updateProduct
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProductCreateRequest' } } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/ProductResult' } } } }
    delete:
      operationId: deleteProduct
      responses:
        "200": { description: Deleted, content: { application/json: { schema: { $ref: '#/components/schemas/ResultVoid' } } } }
components:
  schemas:
    CategoryDTO:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, maxLength: 50 }
    CategoryListResult:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/CategoryDTO' }
    ProductDTO:
      type: object
      required: [id, name, price, stock, categoryId]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string }
        price: { type: number, format: double }
        stock: { type: integer, format: int32 }
        categoryId: { type: integer, format: int64 }
        imageUrl: { type: string }
        status: { type: string, enum: [ON_SALE, OFF_SALE] }
        createdAt: { type: string, format: date-time }
    ProductCreateRequest:
      type: object
      required: [name, price, stock, categoryId]
      properties:
        name: { type: string, maxLength: 100 }
        description: { type: string }
        price: { type: number, minimum: 0 }
        stock: { type: integer, minimum: 0 }
        categoryId: { type: integer, format: int64 }
        imageUrl: { type: string }
        status: { type: string, enum: [ON_SALE, OFF_SALE], default: ON_SALE }
    PageResult:
      type: object
      properties:
        list: { type: array, items: {} }
        total: { type: integer, format: int64 }
        page: { type: integer, format: int64 }
        size: { type: integer, format: int32 }
    ProductPageResult:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/ProductListData' }
    ProductListData:
      allOf:
        - $ref: '#/components/schemas/PageResult'
        - type: object
          properties:
            list: { type: array, items: { $ref: '#/components/schemas/ProductDTO' } }
    ProductResult:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/ProductDTO' }
    Result:
      type: object
      required: [code, message]
      properties:
        code: { type: integer }
        message: { type: string }
    ResultVoid:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          nullable: true
          properties: { data: {} }
