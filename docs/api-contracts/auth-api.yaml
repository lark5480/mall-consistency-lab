openapi: 3.0.3
info: { title: Mall Auth API, version: 1.1.0 }
paths:
  /api/v1/auth/register:
    post:
      operationId: register
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterRequest' } } } }
      responses: { "200": { description: Registered, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResult' } } } } }
  /api/v1/auth/login:
    post:
      operationId: login
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }
      responses: { "200": { description: Logged in, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResult' } } } } }
  /api/v1/auth/me:
    get:
      operationId: me
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: Current user, content: { application/json: { schema: { $ref: '#/components/schemas/UserResult' } } } } }
components:
  securitySchemes: { bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT } }
  schemas:
    RegisterRequest:
      type: object
      required: [username, password]
      properties: { username: { type: string, minLength: 3 }, password: { type: string, minLength: 6 } }
    LoginRequest:
      type: object
      required: [username, password]
      properties: { username: { type: string }, password: { type: string } }
    UserDTO:
      type: object
      required: [userId, username, role]
      properties: { userId: { type: integer, format: int64 }, username: { type: string }, role: { type: string, enum: [USER, ADMIN] } }
    AuthData:
      type: object
      required: [token, userId, username, role]
      properties: { token: { type: string }, userId: { type: integer, format: int64 }, username: { type: string }, role: { type: string, enum: [USER, ADMIN] } }
    Result:
      type: object
      required: [code, message]
      properties: { code: { type: integer }, message: { type: string } }
    AuthResult:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties: { data: { $ref: '#/components/schemas/AuthData' } }
    UserResult:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties: { data: { $ref: '#/components/schemas/UserDTO' } }
